# COFFEE_RELEASE_SETUP_100
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Windows installer
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.401

      - name: Build installer and verify tag version
        if: github.event_name == 'push'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: pwsh
        run: .\build.ps1 -BuildInstaller -ReleaseTag $env:RELEASE_TAG

      - name: Build installer preview
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: .\build.ps1 -BuildInstaller

      - name: Create SHA-256 file
        shell: pwsh
        run: |
          $asset = 'release/CoffeeDesktop-Setup-win-x64.exe'
          $checksum = "${asset}.sha256"
          $hash = (Get-FileHash -LiteralPath $asset -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  CoffeeDesktop-Setup-win-x64.exe" | Set-Content -LiteralPath $checksum -Encoding ascii -NoNewline

      - name: Upload release files for publish job
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: |
            release/CoffeeDesktop-Setup-win-x64.exe
            release/CoffeeDesktop-Setup-win-x64.exe.sha256
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Download release files
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release-assets

      - name: Create release and attach assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: pwsh
        run: |
          gh release create $env:RELEASE_TAG `
            'release-assets/CoffeeDesktop-Setup-win-x64.exe' `
            'release-assets/CoffeeDesktop-Setup-win-x64.exe.sha256' `
            --verify-tag `
            --title "Coffee Desktop $env:RELEASE_TAG" `
            --notes 'Windows x64 self-contained installer. Verify the installer with the attached SHA-256 file.'
